name: Site

# Build the website out of the repository's own pages (`ollin site`) and
# publish it to GitHub Pages.
#
# The site is the README, the Guide, the reference, and the examples with
# their source, rendered by the same text targets `ollin docs` uses, so this
# job compiles three small targets and no framework: a cold run is a couple of
# minutes on a macOS runner (the package is Apple-only, so a Linux runner
# cannot even load the manifest).
#
# It runs on a push to main that touches a page, and by hand. While the
# repository is private the push trigger is skipped rather than paid for: a
# macOS runner bills every minute at 10x, Pages on a private repository needs
# a paid plan anyway, and the build workflow already retired running on push
# for that reason. The moment the repository is public, standard runners are
# free and every push to a page publishes it. A manual run always goes ahead,
# which is how the site is checked before that day.
#
# Publishing needs Pages switched on for the repository, set to deploy from
# GitHub Actions (Settings > Pages > Source). The custom domain comes from a
# repository variable, `SITE_DOMAIN`, so the CNAME is only written once the
# DNS points here; with none set the site serves from the github.io address.

on:
  push:
    branches: [main]
    paths:
      - "*.md"
      - "Guide/**"
      - "Docs/**"
      - "Examples/**/README.md"
      - "Examples/**/Sketch.swift"
      - "Sources/OllinReference/**"
      - "Sources/OllinDocs/**"
      - "Sources/OllinProjects/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

concurrency:
  group: site
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build the site
    runs-on: macos-26
    # The guard that skipped this while the repository was private: a macOS
    # runner bills at ten times the rate there and Pages needs a paid plan, so
    # a push built nothing and only a hand-dispatch did. Public since
    # 2026-09-10, so it answers true on its own and every push that touches
    # the site's sources publishes. Kept rather than deleted because it is
    # what makes a fork of this repository behave the same way.
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Swift version
        run: swift --version

      # The three text targets only: nothing here links the framework.
      - name: Write the site
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
        run: |
          if [ -n "$SITE_DOMAIN" ]; then
            swift run -c release OllinDocs site _site --domain "$SITE_DOMAIN"
          else
            swift run -c release OllinDocs site _site
          fi

      # The Pages upload helper reaches for an unpinned upload action
      # underneath, which this repository's Actions policy refuses, so the
      # same two steps are spelled out here: one tar of the folder, uploaded
      # under the name the deploy step looks for. The flags are the ones
      # both tars accept, since this runner's tar is bsdtar.
      - name: Pack
        run: tar -L -C _site -cf "$RUNNER_TEMP/artifact.tar" .

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Publish to Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
