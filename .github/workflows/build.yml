name: Build

# Compile-test on macOS, in two jobs, because the two halves cost very
# different amounts.
#
# `build` covers the Ollin library, the live/gallery hosts, and the tests: a
# cold build is about nine minutes on the runner's three cores, and the test
# step is the long half (see its note).
#
# `examples` compiles all 350 sketches in the Examples package, which is the
# guard that keeps them building against the current API instead of rotting. It
# picks up new examples automatically, with no list to maintain here (mirroring
# the no-hand-maintained-stanzas rule the manifests follow), but it is the
# expensive half: a cold run is about seventeen minutes, because a path
# dependency is built again inside that package. Kept separate so the cheap
# half can be read on its own, and so this one can be dropped from a run
# without touching the other.
#
# Neither can run on Linux, since Ollin is Swift plus Metal and Apple-platforms
# only, so both use a macOS runner. The Metal shader is compiled at *runtime*
# from source, so no GPU is needed at build time, only the macOS SDK.

# Deliberately NOT run on push. A macOS runner bills every minute at a 10x
# multiplier, a full run is about fifty minutes across both jobs, and pre-1.0
# work goes straight to main at roughly fifteen pushes a day. That is well
# past a thousand billable minutes a day, which exhausts a month's allowance
# in about three, and it did so in both July and August 2026. A green build
# costs exactly as much as a red one, so this is a volume problem and the only
# fix is to stop running it on every commit.
#
# So: pull requests, plus a manual trigger for when a check is actually wanted
# (before a milestone, say). While main is pushed to directly this means the
# workflow effectively does not run, which is the intent. It starts earning its
# keep again on its own the moment pull requests appear, whether from a bot or,
# once the repo is public, from a contributor. Public is also when this stops
# costing anything: standard runners, macOS among them, are free there.
#
# Every pull request, with no path filter, because both jobs are required
# checks on main and a required check that never runs is a merge that can never
# happen. A docs-only change used to skip this workflow, which meant it also
# never reported, and the "main" ruleset would then wait forever for an answer
# nothing was going to give. A filter cannot fix that from this side either: a
# pull request touching a Markdown file and a Swift file matches both a
# paths-ignore and its complement, so a second workflow standing in for the
# skipped one double-reports under the same name. The Examples job answers
# the same need from inside: it always runs and reports, and skips its build
# step when the pull request touched nothing an example compiles against.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# A newer push to the same branch/PR supersedes an in-flight run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (macOS)
    runs-on: macos-26
    # Hard ceiling so a wedged runner can never coast to the 6-hour default.
    # The runner's paravirtualized GPU once failed at test startup and left
    # `swift test` hung for 4.5 hours; at the 10x macOS billing multiplier
    # that single run consumed most of a month's Actions minutes. A full
    # build plus the tests fits under this cap (the build measured 458 s to
    # 732 s across the green runs of 2026-09-01 to 09-03 and 548 s on 09-08,
    # the test step 22 to 30 minutes in one process; see its note), and the
    # test step carries its own tighter one.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The macos-26 image matches the development toolchain (Xcode 26 / the
      # macOS 26 SDK), so what builds locally builds here, including macOS 26
      # SDK symbols the older macos-15 image (Xcode 16 / Swift 6.1.2) couldn't
      # even reference. We don't pin an Xcode path (the exact Xcode_26.x.app name
      # drifts as the image updates); just log the toolchain so a future
      # Swift-version regression is easy to spot. The version also keys the
      # build cache below: a toolchain change invalidates every object file.
      - name: Swift version
        id: swift
        run: |
          swift --version
          echo "version=$(swift --version 2>&1 | head -1 | tr -c 'A-Za-z0-9.\n' '-')" >> "$GITHUB_OUTPUT"

      # The build cache, and what makes it work. SwiftPM decides what to
      # recompile from each source's modification time and size, not its
      # content (measured 2026-09-08 on both build systems: a file given a new
      # inode with its old mtime is left alone, a touched one recompiles). A
      # checkout stamps every file with the moment it was written, so a
      # restored .build would see every source as newer than its objects and
      # rebuild the world, which is the failure that made the earlier no-cache
      # decision look right. So before the restore, every tracked file gets a
      # modification time derived from its content: the same blob always gets
      # the same time, a changed file gets a new one, and the products of the
      # last run stay valid for everything that did not change. No history is
      # needed for that, only the index, which is why the checkout stays
      # shallow. The times land in 2017 to 2020, well before any product.
      - name: Date every tracked file by its content
        run: |
          git ls-files -s -z | python3 -c '
          import os, sys
          for entry in sys.stdin.buffer.read().split(b"\0"):
              if not entry:
                  continue
              meta, path = entry.split(b"\t", 1)
              blob = meta.split()[1]
              when = 1_500_000_000 + int(blob[:8], 16) % 100_000_000
              os.utime(path, (when, when), follow_symlinks=False)
          '

      # The newest cache for this toolchain, whatever commit built it: the
      # exact key only ever matches a re-run of the same commit, and the
      # prefix falls back to the last saved build, from which an incremental
      # build finishes what changed. A run whose build step fails saves
      # nothing (see the save step), and a miss costs only the cold build the
      # step paid before the cache existed. Caches saved on main serve every
      # branch; one saved on a pull request serves that pull request alone.
      - name: Restore the last build
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: build-${{ steps.swift.outputs.version }}-${{ github.sha }}
          restore-keys: |
            build-${{ steps.swift.outputs.version }}-

      # Builds the library, the OllinLive/OllinExamples/OllinLiveCoding hosts,
      # and the test targets. `--build-tests` compiles the tests here, so
      # a test that merely fails to *compile* is reported here rather than after
      # the whole build has already been paid for. It also makes the failure
      # reproducible with one command locally, which a plain `swift build` (which
      # never touches the test targets) quietly is not.
      # Warnings stay warnings; this fails only on a compile error.
      - name: Build everything
        id: build
        run: swift build --build-tests

      # The run goes through Scripts/test.sh ci, so the runner's knowledge
      # lives in one place with the rest of the suite's: which suites want a
      # device this runner does not have (no camera, no speech stack, no
      # hardware decoder, and Vision reports no compute device at all; its
      # `runner` list says why each entry is there), and how the work is laid
      # out. Left in, a device suite does not merely fail here. It parks the
      # cooperative pool, which is one thread per core, and everything else
      # waits behind it: a run measured here spent five minutes silent in the
      # middle of a color round trip, and trivial string tests reported
      # durations of 444 seconds each because they all unblocked at once.
      #
      # Nothing here is the place to put the next skip. That list grew by
      # discovery, one runner failure at a time, and every entry is knowledge
      # about a device that lives beside the suite instead of next to the test
      # that needs it. A test that wants hardware belongs behind an
      # `.enabled(if:)` guard on a probe of that hardware, the way the 592
      # already there do: it then refuses itself wherever the device is
      # absent, this runner included, and at a desk with the screen locked,
      # with no list to keep in sync.
      #
      # The strand-field render tests are the worked example. They did not fail
      # here, they killed the process: this runner's paravirtualized GPU builds a
      # mesh pipeline it cannot encode, and the unrecognized selector that
      # follows is an uncaught Objective-C exception, so one test took the other
      # four thousand with it. What holds it back is a capability check
      # (`MetalRenderer.meshShadersAvailable(on:)`, which the renderer consults
      # before drawing and `Snapshot.hasMeshShaders` gates the tests on), not a
      # thirteenth skip.
      #
      # Worth knowing before writing the next one: only the GPU family tells the
      # truth here. The runner reports `Apple Paravirtual device` with `metal3`
      # false, and yet the mesh pipeline builds and the encoder answers
      # `respondsToSelector:` with true for every call it will then refuse. A
      # capability probe that asks anything nearer the failure than the family
      # gets a yes and crashes anyway, which is how the second run was lost.
      #
      # Why the step is slow is known, and it is not the machine. OllinTests
      # draws through `Sketch`, which is main-actor isolated, so every render
      # probe queues on one thread and a single process uses a fraction of the
      # cores; the log's long silences are that queue draining, in bursts
      # (2026-09-06: 3,400 tests reported in the first ten minutes, six
      # minutes of silence, 1,500 more at minute 22). The recipe runs the
      # loopback suites alone first (a clock train through Core MIDI measured
      # against a window starves beside other processes), then OllinTests as
      # two processes, dealt by suite, with every other target in a third
      # beside them at a lower priority, which is what three cores have room
      # for. The shards invoke the built bundle directly the way SwiftPM
      # itself does; Scripts/shard-tests.sh handles the merged bundle this
      # toolchain writes as well as the per-target one the desk's does,
      # prints a heartbeat with each shard's count (its shards write to their
      # own files, and a silent run reads as a wedge below), and refuses to
      # fall back to one process silently. Measured 2026-09-08 with the cache
      # warm: the build 2 min, the shards 1117 s, the step 19 min.
      #
      # The step timeout is the hang guard, and it has three times been set
      # too low rather than too high: ten minutes was a figure from a much
      # smaller suite, twenty-two was guessed while a crash was still ending
      # every run, and thirty-five was headroom over a single 1316 s green run.
      # In one process the step measured 1330 s to 2000 s green across
      # 2026-09-03 to 09-06 (the spread is the runner's, not the suite's).
      # Forty-five stays until the sharded recipe has a few measurements of
      # its own. A killed run always looks like it did less work than it
      # did: an uncaught exception flushes stdio on the way out, a killed
      # process does not.
      #
      # The run goes through Scripts/ci-test.sh, a watchdog: after fifteen
      # minutes with no output it samples every test process (each thread's
      # stack lands in this log), kills the run, and exits 124. Two runs in
      # one day went silent at about ten minutes in, on a tree that had just
      # passed, and sat there until the cap. A killed process loses its
      # buffered last lines, so the log named nothing; the sample is the
      # diagnosis a machine nobody can attach to can still give, and it is
      # what found the synchronous texture loader parking the main thread
      # (2026-09-06). The cap below stays as the outer bound.
      - name: Test (the runner's recipe)
        timeout-minutes: 45
        run: Scripts/ci-test.sh --run Scripts/test.sh ci

      # Saved after the tests rather than after the build, so a red test run
      # still leaves the next run a warm build; saved only when the build
      # itself succeeded, since a half-built tree is not worth restoring; and
      # not on an exact hit, which is a re-run of a commit already saved.
      # Each save is a new entry under the toolchain's prefix; the repository
      # keeps ten gigabytes of them and evicts the oldest first.
      - name: Save the build
        if: always() && steps.build.outcome == 'success' && steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: build-${{ steps.swift.outputs.version }}-${{ github.sha }}

  # The anti-rot guard: every sketch still compiles against the current API.
  # Separate from `build` because it is the expensive half (see the note at the
  # top of this file) and because nothing in it can fail in a way the library
  # build would not, so a red `build` makes this one's result uninteresting.
  examples:
    name: Examples (macOS)
    runs-on: macos-26
    needs: build
    timeout-minutes: 35
    steps:
      # The whole history, so a pull request can be diffed against its base
      # below; the pack is about 170 MB and the fetch a few seconds.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Swift version
        run: swift --version

      # An example can only stop compiling when the framework, the vendored
      # code, a manifest, or an example's own source changed. A pull request
      # that touched none of those (prose, a figure, a workflow) keeps the
      # job, which is a required check, and skips the seventeen minutes. A
      # dispatched run always builds: it is the milestone check, and it has
      # no base to diff against.
      - name: Decide whether an example can have changed
        id: scope
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "origin/$GITHUB_BASE_REF...HEAD" -- \
            Sources External Package.swift Package.resolved \
            Examples/Package.swift 'Examples/**/*.swift' .github/workflows/build.yml)
          if [ -n "$changed" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "$changed" | head -20
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "nothing an example compiles against changed; the build is skipped"
          fi

      # The examples are their own package, so the build is scoped to it. It
      # builds its own copy of the library through the path dependency, which is
      # why this costs more than the job above rather than less. No cache here:
      # the tree comes to about twelve gigabytes, past the runner's disk and
      # the repository's cache allowance alike.
      - name: Build every example
        if: steps.scope.outputs.build == 'true'
        run: swift build --package-path Examples
