name: Build

# Compile-test on macOS, in two jobs, because the two halves cost very
# different amounts.
#
# `build` covers the Ollin library, the live/gallery hosts, and the tests: a
# cold run is about a minute and a half.
#
# `examples` compiles all 350 sketches in the Examples package, which is the
# guard that keeps them building against the current API instead of rotting. It
# picks up new examples automatically, with no list to maintain here (mirroring
# the no-hand-maintained-stanzas rule the manifests follow), but it is the
# expensive half: a cold run is over six minutes, because a path dependency is
# built again inside that package. Kept separate so the cheap half can be read
# on its own, and so this one can be dropped from a run without touching the
# other.
#
# Neither can run on Linux, since Ollin is Swift plus Metal and Apple-platforms
# only, so both use a macOS runner. The Metal shader is compiled at *runtime*
# from source, so no GPU is needed at build time, only the macOS SDK.

# Deliberately NOT run on push. A macOS runner bills every minute at a 10x
# multiplier, a full run is a cold build of both jobs (about a minute and a half
# for the library and the tests, over six minutes for the 350 examples), and
# pre-1.0 work goes straight to main at roughly fifteen pushes a day. That is
# well past a thousand billable minutes a day, which exhausts a month's
# allowance in about three, and it did so in both July and August 2026. A green
# build costs exactly as much as a red one, so this is a volume problem and the
# only fix is to stop running it on every commit.
#
# So: pull requests, plus a manual trigger for when a check is actually wanted
# (before a milestone, say). While main is pushed to directly this means the
# workflow effectively does not run, which is the intent. It starts earning its
# keep again on its own the moment pull requests appear, whether from a bot or,
# once the repo is public, from a contributor. Public is also when this stops
# costing anything: standard runners, macOS among them, are free there.
#
# Every pull request, with no path filter, because both jobs are required
# checks on main and a required check that never runs is a merge that can never
# happen. A docs-only change used to skip this workflow, which meant it also
# never reported, and the "main" ruleset would then wait forever for an answer
# nothing was going to give. A filter cannot fix that from this side either: a
# pull request touching a Markdown file and a Swift file matches both a
# paths-ignore and its complement, so a second workflow standing in for the
# skipped one double-reports under the same name.
#
# The cost this trades away is the one the note above already retired. Standard
# runners are free on a public repository, so compiling once for a typo fix
# spends nothing but the contributor's patience.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# A newer push to the same branch/PR supersedes an in-flight run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (macOS)
    runs-on: macos-26
    # Hard ceiling so a wedged runner can never coast to the 6-hour default.
    # The runner's paravirtualized GPU once failed at test startup and left
    # `swift test` hung for 4.5 hours; at the 10x macOS billing multiplier
    # that single run consumed most of a month's Actions minutes. A full
    # build plus the tests fits far under this cap (the build alone measured
    # about ninety seconds), and the test step carries its own tighter one.
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The macos-26 image matches the development toolchain (Xcode 26 / the
      # macOS 26 SDK), so what builds locally builds here, including macOS 26
      # SDK symbols the older macos-15 image (Xcode 16 / Swift 6.1.2) couldn't
      # even reference. We don't pin an Xcode path (the exact Xcode_26.x.app name
      # drifts as the image updates); just log the toolchain so a future
      # Swift-version regression is easy to spot.
      - name: Swift version
        run: swift --version

      # There is deliberately no build cache here, and the measurement it rests
      # on has gone stale. The claim was that a cold build of this tree costs
      # about ninety seconds, so caching 1.7 GB to save it buys little. Two
      # green runs on 2026-09-01 measured 527 s and 732 s, five to eight times
      # that, and the spread between two builds of the same code is itself 39%.
      # The Examples job's `swift build` measured 1132 s against a note calling
      # it "over six minutes", and its tree is about 12 GB, which does not fit
      # the 10 GB per-repository cache limit anyway.
      #
      # So the no-cache decision is now resting on a number nobody has
      # re-measured, and it is worth re-deciding rather than inheriting. Not
      # done here: it wants its own measurement, and a cache only ever lands on
      # a green run, which is a thing this job has only just started producing.
      #
      # One earlier failure is worth recording, because it is invisible until
      # looked for: the combined cache action skips its save step when the job
      # fails, and this job failed on every run for weeks, so the cache sat at
      # zero bytes while every run paid for a full from-scratch build. A cache
      # can only ever land on a green run.

      # Builds the library, the OllinLive/OllinExamples/OllinLiveCoding hosts,
      # and the test targets. `--build-tests` compiles the tests here, so
      # a test that merely fails to *compile* is reported here rather than after
      # the whole build has already been paid for. It also makes the failure
      # reproducible with one command locally, which a plain `swift build` (which
      # never touches the test targets) quietly is not.
      # Warnings stay warnings; this fails only on a compile error.
      - name: Build everything
        run: swift build --build-tests

      # Run the GPU-independent tests (the frame-grab seam's dispatch logic).
      # The image-snapshot tests are skipped here on purpose: their reference
      # PNGs are GPU-specific (recorded on a developer's machine) and a CI
      # runner's GPU may anti-alias differently, so they run locally where the
      # reference matches the renderer rather than risk a cross-GPU flake.
      # (They'd also skip on their own via `.enabled(if: hasMetal)` when a
      # runner has no Metal device; `--skip` removes the doubt either way.)
      #
      # FlowTrackerTests are skipped too: Vision's optical-flow analysis needs
      # the real media stack and reliably fails on the virtualized runner with
      # memFullErr ("failed to analyze motion flow"). An environment limit,
      # not a code signal, so it runs locally like the snapshots.
      #
      # measuresAPairInline goes with them, and is named separately because it
      # is the one call to that same optical flow living outside the suite named
      # after it. Vision reports no compute device on the runner at all
      # ("No available compute device for VNComputeStageMain"), so it fails the
      # same way for the same reason. Its suite's other test uses contours,
      # which do run here, so only the one test is named rather than the suite.
      #
      # The suites Scripts/test.sh runs in a phase of their own are skipped
      # outright here, and that list is copied from it deliberately: they are
      # the ones that want a device to themselves, and this runner has none of
      # the devices. No camera, no speech stack, no hardware decoder, and Vision
      # reports no compute device at all. Left in, they do not merely fail. They
      # park the cooperative pool, which is one thread per core, and everything
      # else waits behind them: a run measured here spent five minutes silent in
      # the middle of a color round trip, and trivial string tests reported
      # durations of 444 seconds each because they all unblocked at once.
      #
      # The step timeout is the hang guard, and it has twice been set too low
      # rather than too high: ten minutes was a figure from a much smaller
      # suite, and twenty-two was guessed while a crash was still ending every
      # run before the question could be asked.
      #
      # What is actually known, and it is less than it looks. This step has
      # never once run to completion. The two runs that got furthest each
      # reported about 4,500 tests, at 16 and at 21 minutes, and both were cut
      # short by the crash rather than finishing. A third reached the
      # twenty-two minute cap while still healthy, and its count means nothing:
      # an uncaught exception flushes stdio on the way out, a killed process
      # does not, so a timed-out run always looks like it did less work than a
      # crashed one. So thirty-five is headroom chosen against an unmeasured
      # total, not a measurement, and the next green run is the first real
      # number this project will have. The job cap above is still the outer
      # bound.
      #
      # Measured since: 1316 s green. Four seconds under the twenty-two minute
      # cap that had been cutting it off, which is why one run finished and the
      # next did not. Two runs of the same commit came in 1.6% apart, so the
      # step itself is steady even though the build step above varied 39%
      # between the same two runs.
      #
      # Why it is slow is known, and it is not the machine. OllinTests draws
      # through `Sketch`, which is main-actor isolated, so every render probe
      # queues on one thread and the target uses a fraction of the cores. Those
      # long silences in the log are that queue draining. Sharding is the
      # standing answer and does not work here yet; the note on the test step
      # below says what stopped it.
      #
      # Three more join them for the same reason, found the same way. Screen
      # capture is permitted here and still delivers nothing: the guard those
      # tests already carry asks whether capture is permitted, which the runner
      # answers yes to before handing over a display that never produces a
      # frame. The segmenter's live wiring wants the Vision compute device that
      # does not exist here, and the frame interpolation gate wants a camera.
      # Named individually where one test in a suite needs a device and the
      # rest do not.
      #
      # GeneratedProjectBuildTests goes too, which is what Scripts/test.sh
      # already does for its quick pass. That suite builds whole generated
      # packages by running swift build inside a test, is declared serialized
      # with a fifteen minute limit of its own, and takes OllinProjectsTests
      # from 155 seconds to 725. Fifteen serialized minutes does not fit inside
      # a twenty-two minute step that has four thousand other tests to get
      # through, and on this runner it simply stopped: the log ran normally and
      # then said nothing at all for twenty minutes. It is a milestone check,
      # not a per-commit one.
      # Nothing below is the place to put the next one. This list grew by
      # discovery, one runner failure at a time, and every entry is knowledge
      # about a device that lives here instead of next to the test that needs
      # it. A test that wants hardware belongs behind an `.enabled(if:)` guard
      # on a probe of that hardware, the way the 592 already here do: it then
      # refuses itself wherever the device is absent, this runner included, and
      # at a desk with the screen locked, with no list to keep in sync.
      #
      # The strand-field render tests are the worked example. They did not fail
      # here, they killed the process: this runner's paravirtualized GPU builds a
      # mesh pipeline it cannot encode, and the unrecognized selector that
      # follows is an uncaught Objective-C exception, so one test took the other
      # four thousand with it. What holds it back is a capability check
      # (`MetalRenderer.meshShadersAvailable(on:)`, which the renderer consults
      # before drawing and `Snapshot.hasMeshShaders` gates the tests on), not a
      # thirteenth entry below.
      #
      # Worth knowing before writing the next one: only the GPU family tells the
      # truth here. The runner reports `Apple Paravirtual device` with `metal3`
      # false, and yet the mesh pipeline builds and the encoder answers
      # `respondsToSelector:` with true for every call it will then refuse. A
      # capability probe that asks anything nearer the failure than the family
      # gets a yes and crashes anyway, which is how the second run was lost.
      #
      # The snapshot pattern is anchored with its module name because `--skip`
      # takes an unanchored regex over the full test ID: a bare `SnapshotTests`
      # also matches OllinPhysicsTests.PhysicsSnapshotTests, which silently
      # dropped 46 pure-CPU determinism tests from every run here for weeks.
      #
      # Sharding was tried here and is not in place, which is worth writing down
      # because the attempt looked like it worked. Scripts/shard-tests.sh runs
      # OllinTests as four processes locally (409 s to 189 s) and takes this
      # step's skip list through OLLIN_SHARD_SKIP, so the wiring was easy. What
      # it cannot do is find the bundle: it invokes swiftpm-testing-helper
      # directly against `.build/debug/OllinTests.xctest`, and the toolchain on
      # this image emits one merged `OllinPackageTests.xctest` instead of a
      # bundle per target. Its guard then fires, it says so in one line among
      # ten thousand, and it runs OllinTests in a single process exactly as
      # before. The measured 1337 s that came back was not a sharded run beating
      # nothing; it was an unsharded run, 1.6% off the unsharded run before it.
      #
      # So a future attempt needs bundle discovery that handles both layouts,
      # and it cannot be written blind: this desk is on Swift 6.4 and produces
      # per-target bundles, the runner is on 6.3.3 and produces the merged one,
      # and there is no flag to make either behave like the other. That makes it
      # work to do when a run costs nothing, which is the moment the repository
      # goes public, rather than against a billed runner now. The step fits in
      # its cap unsharded: 1316 s measured green.
      - name: Test (excluding GPU snapshots)
        timeout-minutes: 35
        run: >-
          swift test --skip
          'OllinTests.SnapshotTests|FlowTrackerTests|measuresAPairInline|OllinTests.DataFeedTests|OllinVisionTests.FrameSourceTests|OllinVisionTests.ModelTrackerTests|OllinAudioTests.ListeningTests|OllinTests.SpatialVideoTests|OllinScreenTests.ScreenCaptureTests|liveWiringPublishesMatteCutoutAndCount|theGateNeedsACameraAndAHostThatCanSpareARefresh|GeneratedProjectBuildTests'

  # The anti-rot guard: every sketch still compiles against the current API.
  # Separate from `build` because it is the expensive half (see the note at the
  # top of this file) and because nothing in it can fail in a way the library
  # build would not, so a red `build` makes this one's result uninteresting.
  examples:
    name: Examples (macOS)
    runs-on: macos-26
    needs: build
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Swift version
        run: swift --version

      # The examples are their own package, so the build is scoped to it. It
      # builds its own copy of the library through the path dependency, which is
      # why this costs more than the job above rather than less.
      - name: Build every example
        run: swift build --package-path Examples
