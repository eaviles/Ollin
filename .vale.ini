# Prose lint for the reader-facing pages (Guide + Docs), run via
# Scripts/prose-lint.sh. The voice rules live in Guide/AUTHORING.md; OllinGuide
# encodes their checkable subset, and the Google package supplies a general
# developer-docs word list. Errors block; warnings are judgment prompts (fix,
# or keep on purpose).

StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = Google

[Guide/*.md]
BasedOnStyles = Vale, Google, OllinGuide

; Core Vale: keep the repeated-word catch, skip spell-check (it fights the
; proper nouns: Ollin, Truchet, Molnár, and friends).
Vale.Spelling = NO

; House-style overrides of the Google package (see Guide/AUTHORING.md).
; Voice: "you'll" and "let's" are the Guide's voice, parentheticals are
; welcome, semicolons and the occasional "and you get... mud." ellipsis are
; deliberate, and it is a guide with chapters (the word list bans "chapter").
Google.Will = NO
Google.We = NO
Google.Parens = NO
Google.Ellipses = NO
Google.Exclamation = NO
Google.Semicolons = NO
Google.WordList = NO
Google.Passive = NO
; Punctuation and headings: the repo punctuates logically (outside quotes),
; capitalizes after a colon in nav/credit lines, and uses breadcrumb and
; camelCase-API headings the sentence-case check misreads.
Google.Quotes = NO
Google.Colons = NO
Google.Headings = NO
Google.OxfordComma = NO
; Misfire-prone in this register: "where it is" is not an uncontracted
; "it's", "1940s" is a decade not a unit, and the acronym check can't see
; that RGB/GIF/MIDI are explained at first use (charter principle 1 covers
; that by hand).
Google.Contractions = NO
Google.Units = NO
Google.Acronyms = NO
; First-person is sometimes the teaching voice ("in front of me or behind?").
Google.FirstPerson = NO
; OllinGuide's dash rules carry the repo policy with better messages.
Google.EmDash = NO
Google.EnDash = NO

; Docs/ is reference documentation: a different tone than the Guide (neutral,
; terse), but the same plain-words bar. Same rule set, two differences: the
; Guide-only self-reference check is off, and em dashes are a warning, not an
; error, until the deferred strip of the ~660 pre-existing ones lands (they
; convert file by file as pages get edited; raise to error after).
[Docs/**/*.md]
BasedOnStyles = Vale, Google, OllinGuide
Vale.Spelling = NO
OllinGuide.SelfReference = NO
OllinGuide.EmDash = warning
Google.Will = NO
Google.We = NO
Google.Parens = NO
Google.Ellipses = NO
Google.Exclamation = NO
Google.Semicolons = NO
Google.WordList = NO
Google.Passive = NO
Google.Quotes = NO
Google.Colons = NO
Google.Headings = NO
Google.OxfordComma = NO
Google.Contractions = NO
Google.Units = NO
Google.Acronyms = NO
Google.FirstPerson = NO
Google.EmDash = NO
Google.EnDash = NO

; The reader-facing READMEs (repo front page, and the Docs/Guide/Examples
; index pages) carry the same voice rules in the Docs register: see the
; "not Guide-only" note in Guide/AUTHORING.md. Em dashes stay a warning here
; for the same reason as Docs/, and self-reference is off since the repo README
; legitimately talks about the project rather than about itself as a guide.
[{README.md,Docs/README.md,Guide/README.md,Examples/README.md}]
BasedOnStyles = Vale, Google, OllinGuide
Vale.Spelling = NO
OllinGuide.SelfReference = NO
OllinGuide.EmDash = warning
Google.Will = NO
Google.We = NO
Google.Parens = NO
Google.Ellipses = NO
Google.Exclamation = NO
Google.Semicolons = NO
Google.WordList = NO
Google.Passive = NO
Google.Quotes = NO
Google.Colons = NO
Google.Headings = NO
Google.OxfordComma = NO
Google.Contractions = NO
Google.Units = NO
Google.Acronyms = NO
Google.FirstPerson = NO
Google.EmDash = NO
Google.EnDash = NO

; The contributor docs are not reader-facing prose; the charter quotes banned
; phrases as counterexamples, so linting it would cry wolf.
[{Guide/AUTHORING.md,Guide/PLAN.md}]
BasedOnStyles =
