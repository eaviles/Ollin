# Xcode project spec for the Ollin Capture iOS app.
#
# Generate with:  xcodegen generate   (from this directory)
# Build/deploy:   open OllinPhoneApp.xcodeproj, select the iPhone, Run — or
#                 xcodebuild ... -allowProvisioningUpdates build
#
# Like Apps/OllinCameraApp, this is an Xcode (not SwiftPM) project: an iOS app
# can't be `swift run`, it's installed onto a device. Automatic signing on team
# 3ET6D79498 provisions it (the device must be registered — see the README).

name: OllinPhoneApp

options:
  bundleIdPrefix: dev.ollin
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: "3ET6D79498"
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO

targets:
  OllinPhoneApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # The wire protocol is shared *verbatim* with the Mac satellite — one copy,
      # compiled into both ends. It imports only Foundation/simd, never Ollin.
      - path: ../../Sources/OllinPhone/PhoneWire.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ollin.OllinPhoneApp
        PRODUCT_NAME: "Ollin Capture"
        INFOPLIST_FILE: Info.plist
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only
        ENABLE_USER_SCRIPT_SANDBOXING: YES
